<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Tienda - Control de Ventas</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    .tab-active { border-bottom: 4px solid #2563eb; color: #2563eb; font-weight: 700; }
    .product-card { transition: all 0.3s; }
    .product-card:hover { transform: translateY(-8px); box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1); }
  </style>
</head>
<body class="bg-gray-100">

<div class="max-w-7xl mx-auto">
  <nav class="bg-white shadow sticky top-0 z-50">
    <div class="px-6 py-4 flex gap-6 text-sm overflow-x-auto">
      <button onclick="showTab(0)" class="tab-active px-5 py-3" id="tab0">📊 Dashboard</button>
      <button onclick="showTab(1)" class="px-5 py-3" id="tab1">👥 Clientes</button>
      <button onclick="showTab(2)" class="px-5 py-3" id="tab2">📋 Artículos</button>
      <button onclick="showTab(3)" class="px-5 py-3" id="tab3">🛍️ Catálogo</button>
      <button onclick="showTab(4)" class="px-5 py-3" id="tab4">💰 Nueva Venta</button>
      <button onclick="showTab(5)" class="px-5 py-3" id="tab5">💵 Pagos</button>
    </div>
  </nav>
  <div class="p-6" id="content"></div>
</div>

<!-- Modal -->
<div id="modal" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center z-50">
  <div class="bg-white rounded-3xl shadow-2xl w-full max-w-lg mx-4" id="modalContent"></div>
</div>

<script>
// ==================== BASE DE DATOS ====================
let db = {
  clientes: JSON.parse(localStorage.getItem('clientes')) || [],
  productos: JSON.parse(localStorage.getItem('productos')) || [],
  ventas: JSON.parse(localStorage.getItem('ventas')) || [],
  pagos: JSON.parse(localStorage.getItem('pagos')) || []
};

let carrito = [];

function saveDB() {
  localStorage.setItem('clientes', JSON.stringify(db.clientes));
  localStorage.setItem('productos', JSON.stringify(db.productos));
  localStorage.setItem('ventas', JSON.stringify(db.ventas));
  localStorage.setItem('pagos', JSON.stringify(db.pagos));
}

function showTab(n) {
  document.querySelectorAll('button[id^="tab"]').forEach(b => b.classList.remove('tab-active'));
  document.getElementById('tab'+n).classList.add('tab-active');
  
  const content = document.getElementById('content');
  if (n === 0) content.innerHTML = dashboardHTML();
  if (n === 1) content.innerHTML = clientesHTML();
  if (n === 2) content.innerHTML = articulosHTML();
  if (n === 3) content.innerHTML = catalogoHTML();
  if (n === 4) content.innerHTML = nuevaVentaHTML();
  if (n === 5) content.innerHTML = pagosHTML();
}

// ==================== DASHBOARD ====================
function dashboardHTML() {
  const total = db.ventas.reduce((a,v) => a + (v.total || 0), 0);
  const pendientes = db.ventas.filter(v => v.saldo > 0).length;
  return `
    <h2 class="text-3xl font-bold mb-8">Dashboard</h2>
    <div class="grid grid-cols-2 md:grid-cols-4 gap-6">
      <div class="bg-white p-8 rounded-3xl shadow text-center">
        <p class="text-gray-500">Total Vendido</p>
        <p class="text-4xl font-bold mt-2">$${total.toLocaleString()}</p>
      </div>
      <div class="bg-white p-8 rounded-3xl shadow text-center">
        <p class="text-gray-500">Clientes</p>
        <p class="text-4xl font-bold mt-2">${db.clientes.length}</p>
      </div>
      <div class="bg-white p-8 rounded-3xl shadow text-center">
        <p class="text-gray-500">Artículos</p>
        <p class="text-4xl font-bold mt-2">${db.productos.length}</p>
      </div>
      <div class="bg-white p-8 rounded-3xl shadow text-center">
        <p class="text-orange-600">Pendientes</p>
        <p class="text-4xl font-bold mt-2">${pendientes}</p>
      </div>
    </div>
  `;
}

// ==================== CLIENTES ====================
function clientesHTML() {
  return `
    <div class="flex justify-between items-center mb-6">
      <h2 class="text-3xl font-bold">Clientes</h2>
      <button onclick="abrirFormularioCliente()" class="bg-blue-600 text-white px-6 py-3 rounded-2xl">+ Nuevo Cliente</button>
    </div>
    <div class="bg-white rounded-3xl shadow overflow-hidden">
      <table class="w-full">
        <thead class="bg-gray-50">
          <tr>
            <th class="p-5 text-left">Nombre</th>
            <th class="p-5 text-left">Teléfono</th>
            <th class="p-5 text-right">Comprado</th>
            <th class="p-5 w-28">Acciones</th>
          </tr>
        </thead>
        <tbody>
          ${db.clientes.map(c => `
            <tr class="border-t hover:bg-gray-50">
              <td class="p-5">${c.nombre}</td>
              <td class="p-5">${c.telefono || '-'}</td>
              <td class="p-5 text-right">$${(c.compras||0).toLocaleString()}</td>
              <td class="p-5">
                <button onclick="editarCliente(${c.id})" class="mr-4 text-blue-600">✏️</button>
                <button onclick="eliminarCliente(${c.id})" class="text-red-600">🗑️</button>
              </td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>
  `;
}

function abrirFormularioCliente(cliente = null) {
  document.getElementById('modalContent').innerHTML = `
    <div class="p-8">
      <h3 class="text-2xl font-bold mb-6">${cliente ? 'Editar' : 'Nuevo'} Cliente</h3>
      <input id="nombre" value="${cliente?.nombre || ''}" placeholder="Nombre completo" class="w-full p-4 border rounded-2xl mb-4">
      <input id="telefono" value="${cliente?.telefono || ''}" placeholder="Teléfono" class="w-full p-4 border rounded-2xl mb-6">
      <div class="flex gap-4">
        <button onclick="guardarCliente(${cliente ? cliente.id : 'null'})" class="flex-1 bg-blue-600 text-white py-4 rounded-2xl">Guardar</button>
        <button onclick="cerrarModal()" class="flex-1 bg-gray-200 py-4 rounded-2xl">Cancelar</button>
      </div>
    </div>
  `;
  document.getElementById('modal').classList.remove('hidden');
}

function guardarCliente(id) {
  const nombre = document.getElementById('nombre').value.trim();
  if (!nombre) return Swal.fire({icon:'error', title:'Error', text:'Nombre obligatorio'});
  if (id !== null) {
    const c = db.clientes.find(x => x.id === id);
    if (c) { c.nombre = nombre; c.telefono = document.getElementById('telefono').value.trim(); }
  } else {
    db.clientes.push({id: Date.now(), nombre, telefono: document.getElementById('telefono').value.trim(), compras: 0});
  }
  saveDB();
  cerrarModal();
  showTab(1);
  Swal.fire({icon:'success', title:'Guardado', toast:true, position:'top-end', timer:2000, showConfirmButton:false});
}

function editarCliente(id) {
  const cliente = db.clientes.find(c => c.id === id);
  if (cliente) abrirFormularioCliente(cliente);
}

function eliminarCliente(id) {
  if (confirm("¿Eliminar cliente?")) {
    db.clientes = db.clientes.filter(c => c.id !== id);
    saveDB();
    showTab(1);
  }
}

// ==================== ARTÍCULOS ====================
function articulosHTML() {
  return `
    <div class="flex justify-between items-center mb-6">
      <h2 class="text-3xl font-bold">Artículos</h2>
      <button onclick="abrirFormularioProducto()" class="bg-green-600 text-white px-6 py-3 rounded-2xl">+ Nuevo Artículo</button>
    </div>
    <div class="bg-white rounded-3xl shadow overflow-hidden">
      <table class="w-full">
        <thead class="bg-gray-50">
          <tr>
            <th class="p-5 text-left">Nombre</th>
            <th class="p-5 text-right">Contado</th>
            <th class="p-5 text-right">Cuota 6</th>
            <th class="p-5 text-center">Stock</th>
            <th class="p-5 w-28">Acciones</th>
          </tr>
        </thead>
        <tbody>
          ${db.productos.map(p => `
            <tr class="border-t">
              <td class="p-5">${p.nombre}</td>
              <td class="p-5 text-right font-bold">$${p.precioContado}</td>
              <td class="p-5 text-right">$${p.preciosCuotas?.[6] || 0}</td>
              <td class="p-5 text-center font-bold">${p.stock}</td>
              <td class="p-5">
                <button onclick="editarProducto(${p.id})" class="mr-4 text-blue-600">✏️</button>
                <button onclick="eliminarProducto(${p.id})" class="text-red-600">🗑️</button>
              </td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>
  `;
}

// ==================== CATÁLOGO ====================
function catalogoHTML() {
  return `
    <div class="flex justify-between items-center mb-8">
      <h2 class="text-3xl font-bold">Catálogo</h2>
      <div class="flex gap-3">
        <button onclick="exportarCatalogoPDF()" class="bg-red-600 text-white px-5 py-3 rounded-2xl flex items-center gap-2">
          <i class="fa-solid fa-file-pdf"></i> PDF
        </button>
        <button onclick="compartirPorWhatsApp()" class="bg-green-600 text-white px-5 py-3 rounded-2xl flex items-center gap-2">
          <i class="fa-solid fa-share"></i> WhatsApp
        </button>
      </div>
    </div>
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
      ${db.productos.map(p => `
        <div class="product-card bg-white rounded-3xl shadow overflow-hidden">
          <img src="${p.foto || 'https://picsum.photos/id/20/300/200'}" class="w-full h-52 object-cover">
          <div class="p-6">
            <h3 class="font-bold text-lg mb-2">${p.nombre}</h3>
            <p class="text-3xl font-bold text-green-600">$${p.precioContado}</p>
            <p class="text-sm text-gray-500">Precio de Contado</p>
          </div>
        </div>
      `).join('') || '<p class="col-span-full text-center py-20 text-gray-500">Aún no hay artículos</p>'}
    </div>
  `;
}

function compartirPorWhatsApp() {
  if (db.productos.length === 0) return Swal.fire({icon:'warning', title:'Catálogo vacío'});
  let msg = "🌟 *CATÁLOGO MI TIENDA* 🌟\n\n";
  db.productos.forEach(p => msg += `📌 ${p.nombre}\n💰 $${p.precioContado}\n\n`);
  window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`, '_blank');
}

function exportarCatalogoPDF() {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  let y = 20;
  doc.setFontSize(22);
  doc.text("CATÁLOGO - MI TIENDA", 105, y, { align: "center" });
  y += 20;
  db.productos.forEach((p, i) => {
    if (y > 270) { doc.addPage(); y = 20; }
    doc.setFontSize(14);
    doc.text(`${i+1}. ${p.nombre}`, 20, y);
    doc.setFontSize(16);
    doc.text(`$${p.precioContado}`, 160, y);
    y += 15;
  });
  doc.save("Catalogo_Mi_Tienda.pdf");
}

// ==================== FORMULARIO PRODUCTO ====================
function abrirFormularioProducto(prod = null) {
  document.getElementById('modalContent').innerHTML = `
    <div class="p-8">
      <h3 class="text-2xl font-bold mb-6">${prod ? 'Editar' : 'Nuevo'} Artículo</h3>
      <input id="nombreProd" value="${prod?.nombre || ''}" placeholder="Nombre" class="w-full p-4 border rounded-2xl mb-4">
      <input type="file" id="fotoInput" accept="image/*" class="w-full p-3 border rounded-2xl mb-4">
      <div class="grid grid-cols-2 gap-4">
        <div><label>Costo</label><input id="costo" type="number" value="${prod?.costo || ''}" class="w-full p-4 border rounded-2xl mt-1"></div>
        <div><label>Precio Contado</label><input id="precioContado" type="number" value="${prod?.precioContado || ''}" class="w-full p-4 border rounded-2xl mt-1"></div>
      </div>
      <h4 class="mt-6 mb-3 font-medium">Precio Cuota Semanal</h4>
      <div class="grid grid-cols-2 gap-4">
        <div><label>4 sem</label><input id="c4" type="number" value="${prod?.preciosCuotas?.[4] || ''}" class="w-full p-4 border rounded-2xl"></div>
        <div><label>6 sem</label><input id="c6" type="number" value="${prod?.preciosCuotas?.[6] || ''}" class="w-full p-4 border rounded-2xl"></div>
        <div><label>8 sem</label><input id="c8" type="number" value="${prod?.preciosCuotas?.[8] || ''}" class="w-full p-4 border rounded-2xl"></div>
        <div><label>12 sem</label><input id="c12" type="number" value="${prod?.preciosCuotas?.[12] || ''}" class="w-full p-4 border rounded-2xl"></div>
      </div>
      <div class="mt-4"><label>Stock</label><input id="stock" type="number" value="${prod?.stock || 0}" class="w-full p-4 border rounded-2xl mt-1"></div>
      <div class="flex gap-4 mt-8">
        <button onclick="guardarProducto(${prod ? prod.id : 'null'})" class="flex-1 bg-green-600 text-white py-4 rounded-2xl">Guardar</button>
        <button onclick="cerrarModal()" class="flex-1 bg-gray-200 py-4 rounded-2xl">Cancelar</button>
      </div>
    </div>
  `;
  document.getElementById('modal').classList.remove('hidden');
}

function guardarProducto(id) {
  const nombre = document.getElementById('nombreProd').value.trim();
  if (!nombre) return Swal.fire({icon:'error', title:'Error', text:'Nombre obligatorio'});

  const fileInput = document.getElementById('fotoInput');
  if (fileInput.files.length > 0) {
    const reader = new FileReader();
    reader.onload = e => saveProductoFinal(id, nombre, e.target.result);
    reader.readAsDataURL(fileInput.files[0]);
  } else {
    saveProductoFinal(id, nombre, null);
  }
}

function saveProductoFinal(id, nombre, foto) {
  const producto = {
    id: id !== null ? id : Date.now(),
    nombre,
    costo: Number(document.getElementById('costo').value) || 0,
    precioContado: Number(document.getElementById('precioContado').value) || 0,
    preciosCuotas: {
      4: Number(document.getElementById('c4').value) || 0,
      6: Number(document.getElementById('c6').value) || 0,
      8: Number(document.getElementById('c8').value) || 0,
      12: Number(document.getElementById('c12').value) || 0
    },
    stock: Number(document.getElementById('stock').value) || 0,
    foto: foto || (id !== null ? db.productos.find(p => p.id === id)?.foto : null)
  };

  if (id !== null) {
    const index = db.productos.findIndex(p => p.id === id);
    db.productos[index] = producto;
  } else {
    db.productos.push(producto);
  }
  saveDB();
  cerrarModal();
  showTab(2);
  Swal.fire({icon:'success', title:'Guardado', toast:true, position:'top-end', timer:2000, showConfirmButton:false});
}

function editarProducto(id) {
  const prod = db.productos.find(p => p.id === id);
  if (prod) abrirFormularioProducto(prod);
}

function eliminarProducto(id) {
  if (confirm("¿Eliminar artículo?")) {
    db.productos = db.productos.filter(p => p.id !== id);
    saveDB();
    showTab(2);
  }
}

// ==================== NUEVA VENTA ====================
function nuevaVentaHTML() {
  return `
    <h2 class="text-3xl font-bold mb-6">Nueva Venta</h2>
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
      <div class="bg-white rounded-3xl shadow p-8">
        <select id="clienteSelect" class="w-full p-4 border rounded-2xl mb-6">
          <option value="">Seleccionar Cliente</option>
          ${db.clientes.map(c => `<option value="${c.id}">${c.nombre}</option>`).join('')}
        </select>
        <select id="productoSelect" onchange="agregarAlCarrito()" class="w-full p-4 border rounded-2xl mb-4">
          <option value="">Seleccionar Artículo</option>
          ${db.productos.filter(p => p.stock > 0).map(p => `<option value="${p.id}">${p.nombre}</option>`).join('')}
        </select>
        <div id="carritoLista" class="space-y-3 min-h-52"></div>
      </div>
      <div class="bg-white rounded-3xl shadow p-8">
        <label class="block text-sm mb-2">Plan de Pago</label>
        <select id="cuotasSelect" onchange="calcularTotal()" class="w-full p-4 border rounded-2xl mb-6">
          <option value="1">Contado</option>
          <option value="4">4 Cuotas</option>
          <option value="6" selected>6 Cuotas</option>
          <option value="8">8 Cuotas</option>
          <option value="12">12 Cuotas</option>
        </select>
        <p class="text-4xl font-bold text-green-600" id="totalFinal">$0</p>
        <button onclick="finalizarVenta()" class="w-full mt-12 bg-green-600 text-white py-6 rounded-3xl text-xl font-bold">Finalizar Venta</button>
      </div>
    </div>
  `;
}

function agregarAlCarrito() {
  const id = document.getElementById('productoSelect').value;
  if (!id) return;
  const prod = db.productos.find(p => p.id == id);
  if (prod && prod.stock > 0) {
    carrito.push(prod);
    actualizarCarrito();
  }
}

function actualizarCarrito() {
  let html = '';
  carrito.forEach((item, i) => {
    html += `<div class="flex justify-between bg-gray-50 p-4 rounded-2xl"><span>${item.nombre}</span><button onclick="quitarDelCarrito(${i})" class="text-red-500">×</button></div>`;
  });
  document.getElementById('carritoLista').innerHTML = html || '<p class="text-gray-400 py-8 text-center">Carrito vacío</p>';
  calcularTotal();
}

function quitarDelCarrito(i) {
  carrito.splice(i, 1);
  actualizarCarrito();
}

function calcularTotal() {
  const cuotas = parseInt(document.getElementById('cuotasSelect').value);
  let total = 0;
  carrito.forEach(item => {
    if (cuotas === 1) total += item.precioContado;
    else total += (item.preciosCuotas[cuotas] || item.precioContado) * cuotas;
  });
  document.getElementById('totalFinal').textContent = '$' + total.toLocaleString();
}

function finalizarVenta() {
  if (carrito.length === 0) return Swal.fire({icon:'warning', title:'Carrito vacío'});
  const clienteId = document.getElementById('clienteSelect').value;
  if (!clienteId) return Swal.fire({icon:'warning', title:'Selecciona cliente'});

  const cliente = db.clientes.find(c => c.id == clienteId);
  const cuotas = parseInt(document.getElementById('cuotasSelect').value);
  let total = 0;
  carrito.forEach(item => {
    const precio = cuotas === 1 ? item.precioContado : (item.preciosCuotas[cuotas] || item.precioContado) * cuotas;
    total += precio;
  });

  const venta = {
    id: Date.now(),
    fecha: new Date().toLocaleDateString('es-AR'),
    clienteNombre: cliente.nombre,
    items: carrito.map(p => p.nombre),
    total: total,
    cuotasTotales: cuotas,
    cuotasPagadas: 0,
    saldo: total,
    pagado: cuotas === 1 ? total : 0
  };

  db.ventas.push(venta);
  carrito.forEach(item => {
    const prod = db.productos.find(p => p.id === item.id);
    if (prod) prod.stock--;
  });
  cliente.compras = (cliente.compras || 0) + total;

  saveDB();
  carrito = [];
  Swal.fire({icon:'success', title:'Venta registrada correctamente', toast:true, position:'top-end', timer:2500, showConfirmButton:false});
  showTab(0);
}

// ==================== PAGOS ====================
function pagosHTML() {
  const pendientes = db.ventas.filter(v => v.saldo > 0);
  return `
    <h2 class="text-3xl font-bold mb-6">Pagos Pendientes</h2>
    <div class="space-y-6">
      ${pendientes.map(v => `
        <div class="bg-white p-6 rounded-3xl shadow">
          <div class="flex justify-between">
            <div>
              <p class="font-bold">${v.clienteNombre}</p>
              <p class="text-sm">${v.items ? v.items.join(', ') : ''}</p>
            </div>
            <div class="text-right">
              <p class="text-red-600 font-bold">$${v.saldo}</p>
              <p class="text-sm">${v.cuotasPagadas}/${v.cuotasTotales} cuotas</p>
            </div>
          </div>
          <button onclick="registrarPago(${v.id})" class="mt-6 w-full bg-green-600 text-white py-5 rounded-2xl">Registrar Pago Semanal</button>
        </div>
      `).join('') || '<p class="text-center py-20 text-gray-500">No hay pagos pendientes</p>'}
    </div>
  `;
}

function registrarPago(ventaId) {
  const venta = db.ventas.find(v => v.id === ventaId);
  const monto = Math.round(venta.total / venta.cuotasTotales);

  Swal.fire({
    title: `¿Registrar pago de $${monto}?`,
    icon: 'question',
    showCancelButton: true,
    confirmButtonText: 'Sí, confirmar'
  }).then(result => {
    if (result.isConfirmed) {
      venta.saldo -= monto;
      venta.cuotasPagadas++;
      saveDB();
      generarReciboPDF(venta, monto);
      Swal.fire({icon:'success', title:'Pago registrado', toast:true, position:'top-end', timer:2000, showConfirmButton:false});
      showTab(5);
    }
  });
}

function generarReciboPDF(venta, monto) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  const fecha = new Date().toLocaleDateString('es-AR');
  const hora = new Date().toLocaleTimeString('es-AR', {hour:'2-digit', minute:'2-digit'});

  doc.setFontSize(20);
  doc.text("RECIBO DE PAGO", 105, 25, { align: "center" });
  doc.setFontSize(12);
  doc.text(`Cliente: ${venta.clienteNombre}`, 20, 45);
  doc.text(`Fecha: ${fecha}   Hora: ${hora}`, 20, 55);
  doc.text(`Monto: $${monto}`, 20, 70);
  doc.text(`Cuotas: ${venta.cuotasPagadas}/${venta.cuotasTotales}`, 20, 80);
  doc.text(`Saldo restante: $${venta.saldo}`, 20, 90);
  doc.setFontSize(14);
  doc.text("¡Gracias por su pago!", 105, 120, { align: "center" });
  doc.save(`Recibo_${venta.clienteNombre}.pdf`);
}

function cerrarModal() {
  document.getElementById('modal').classList.add('hidden');
}

// Iniciar la aplicación
showTab(0);
</script>
</body>
</html>
